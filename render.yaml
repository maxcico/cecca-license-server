services:
  - type: web
    name: cecca-license-server
    env: python
    rootDir: license-server-railway
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cecca-license-db
          property: connectionString
      - key: LICENSE_API_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: cecca-license-db
    databaseName: cecca_license
    user: cecca_license_user
